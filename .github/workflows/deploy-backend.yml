name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy'}}

      - name: Build Backend
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy'}}

      - name: Copy Prisma Generated to dist
        run: cp -r src/generated dist/generated

      - name: Prepare Deployment Artifacts
        run: |
          mkdir -p deploy_artifact
          cp -r dist deploy_artifact/
          cp package.json deploy_artifact/
          cp pnpm-lock.yaml deploy_artifact/
          cp -r prisma deploy_artifact/
          cp prisma.config.ts deploy_artifact/

      - name: Deploy to cPanel (Rsync)
        uses: Burnett01/rsync-deployments@5.2.1
        with:
          switches: -avzr --delete --exclude="node_modules" --exclude=".env" --exclude=".git" --chmod=D2755,F644
          path: ./deploy_artifact/
          remote_path: /home/greensto/api-ldsv1.greenstoneng.com/
          remote_host: ${{ secrets.CPANEL_HOST }}
          remote_user: ${{ secrets.CPANEL_USERNAME }}
          remote_key: ${{ secrets.CPANEL_SSH_KEY }}
          remote_port: 22

      - name: Restart App via Passenger
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -e

          # Write key cleanly
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy
          chmod 600 ~/.ssh/cpanel_deploy

          # Remove any Windows line endings
          sed -i 's/\r$//' ~/.ssh/cpanel_deploy

          # Add key to ssh-agent (same method used by rsync action)
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/cpanel_deploy

          echo "=== SSH Key Added Successfully ==="

          # Now run the restart command
          ssh -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/dev/null \
              -p 22 \
              "${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}" \
              '
                cd /home/greensto/api-ldsv1.greenstoneng.com &&
                mkdir -p tmp &&
                touch tmp/restart.txt &&
                echo "✅ Restart signal sent successfully at $(date)"
              '
        shell: bash